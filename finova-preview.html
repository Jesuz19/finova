<title>Finova — Dashboard</title>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fa;
  color:#17202a;
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
}

/* HEADER */
.header{
  background:#ffffff;
  padding:18px 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.5px;
}

.logo span{
  color:#16a34a;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e8f5ed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  color:#15803d;
}

/* MAIN */
.main{
  padding:20px;
}

.greeting{
  margin-bottom:18px;
}

.greeting h1{
  margin:0;
  font-size:25px;
}

.greeting p{
  margin:5px 0 0;
  color:#6b7280;
  font-size:14px;
}

/* BALANCE */
.balance{
  background:linear-gradient(135deg,#123b2a,#17643f);
  color:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 10px 25px rgba(18,59,42,.15);
}

.balance-label{
  font-size:13px;
  opacity:.8;
}

.balance-value{
  font-size:34px;
  font-weight:800;
  margin:8px 0 5px;
}

.balance-sub{
  font-size:13px;
  opacity:.8;
}

/* SCORE */
.score{
  margin-top:16px;
  background:white;
  border-radius:18px;
  padding:18px;
  border:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.score-info h2{
  margin:0;
  font-size:17px;
}

.score-info p{
  margin:5px 0 0;
  color:#6b7280;
  font-size:13px;
}

.score-number{
  font-size:30px;
  font-weight:800;
  color:#16a34a;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:16px;
}

.card{

  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
}
